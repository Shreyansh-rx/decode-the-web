<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart Challenge</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
    .cart-container { max-width: 650px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
    .cart-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #334155; }
    button { background: #6366f1; color: white; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .total-section { margin-top: 20px; text-align: right; font-size: 1.25rem; font-weight: 700; color: #38bdf8; }
    #empty-cart-msg { display: none; color: #94a3b8; text-align: center; padding: 20px 0; font-style: italic; }
  </style>
</head>
<body>
  <div class="cart-container">
    <h2>Shopping Cart</h2>
    <div id="empty-cart-msg">Your cart is currently empty!</div>
    <div id="cart-items-container"></div>
    <div class="total-section">Total: <span id="cart-total">$0.00</span></div>
    <div style="margin-top: 16px; text-align: right;">
      <button id="checkout-btn" style="background: #22c55e; padding: 10px 20px; font-weight: bold;">Proceed to Checkout</button>
    </div>
  </div>
  <script src="cart.js"></script>
</body>
</html>
