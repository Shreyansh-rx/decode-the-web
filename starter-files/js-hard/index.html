<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Broken Dashboard - JS Hard Challenge</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; }
    .dashboard { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; }
    .filters { display: flex; gap: 10px; margin-bottom: 20px; }
    .filters button { padding: 8px 16px; background: #334155; border: none; color: white; border-radius: 6px; cursor: pointer; }
    .metrics { display: flex; gap: 20px; margin-bottom: 20px; }
    .metric-card { background: #0f172a; padding: 16px; border-radius: 8px; flex: 1; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    .btn-action { padding: 6px 12px; background: #3b82f6; border: none; color: white; border-radius: 4px; cursor: pointer; }
    #loader { display: none; color: #38bdf8; font-weight: bold; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="dashboard">
    <h2>Analytics Dashboard (Runtime Debugging)</h2>
    <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 16px;">Click rapidly across timeframe buttons to witness the async race condition, and observe duplicate event listeners in DevTools.</p>
    
    <div class="filters">
      <button onclick="fetchDashboardData('today')">Today</button>
      <button onclick="fetchDashboardData('7days')">7 Days</button>
      <button onclick="fetchDashboardData('30days')">30 Days</button>
    </div>

    <div class="metrics">
      <div class="metric-card">
        <div style="color: #94a3b8; font-size: 0.8rem;">Total Revenue</div>
        <div id="metric-rev" style="font-size: 1.8rem; font-weight: 700; color: #4ade80;">$0</div>
      </div>
    </div>

    <div id="loader">Fetching simulated API data...</div>
    
    <table>
      <thead>
        <tr><th>Channel</th><th>Revenue</th><th>Actions</th></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
