<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Layout Repair - CSS Moderate Challenge</title>
  <link rel="stylesheet" href="dashboard.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; }
    .sidebar { background: #1e293b; padding: 24px; min-height: 100vh; border-right: 1px solid #334155; }
    .main-content { padding: 32px; }
    .card { background: #1e293b; padding: 24px; border-radius: 8px; border: 1px solid #334155; }
    h1 { margin-bottom: 24px; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <h2>Analytics</h2>
      <ul style="list-style: none; margin-top: 20px; line-height: 2;">
        <li>Overview</li>
        <li>Metrics</li>
        <li>Reports</li>
        <li>Settings</li>
      </ul>
    </aside>

    <main class="main-content">
      <h1>Performance Overview</h1>
      <div class="card-grid">
        <div class="card"><h3>Total Revenue</h3><p style="font-size: 2rem; color: #4ade80;">$48,200</p></div>
        <div class="card"><h3>Active Users</h3><p style="font-size: 2rem; color: #38bdf8;">14,350</p></div>
        <div class="card"><h3>Conversion Rate</h3><p style="font-size: 2rem; color: #a855f7;">4.8%</p></div>
        <div class="card"><h3>Bounce Rate</h3><p style="font-size: 2rem; color: #f59e0b;">24.2%</p></div>
      </div>
    </main>
  </div>
</body>
</html>
